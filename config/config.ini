; ===============================
; QRPicker 設定ファイル
; ===============================
; exe と同じフォルダに配置してください
; 変更後は QRPicker を再起動してください
; ===============================

[general]
; 通知を有効にするか
notify = true

; 履歴保存件数
history_size = 20

; テーマ: dark / light
theme = dark


[hotkey]
; 修飾キー
ctrl = true
shift = true
alt = false

; メインキー（A-Z）
key = Q


[advanced]
; DPI スケーリング対策（通常 true）
dpi_aware = true
